name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      
      - name: Run tests
        run: pnpm test

      - name: Publish base
        working-directory: packages/discord-message-transcript-base
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main
        working-directory: packages/discord-message-transcript
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
